name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "URL"
        required: true
      name:
        description: "Name, English, Linux no capital"
        required: true
      icon:
        description: "Icon, Image URL, Optional"
        required: false
      width:
        description: "Width, Optional"
        required: false
        default: "1200"
      height:
        description: "Height, Optional"
        required: false
        default: "780"
      fullscreen:
        description: "Fullscreen, At startup, Optional"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "Hide TitleBar, MacOS only, Optional"
        required: false
        type: boolean
        default: false
      multi_arch:
        description: "MultiArch, MacOS only, Optional"
        required: false
        type: boolean
        default: false
      targets:
        description: "Targets, Linux only, Optional"
        required: false
        default: "deb"
        type: choice
        options:
          - "deb"
          - "appimage"
          - "rpm"

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      # 🆕 macOS 专用：安装 DMG 打包工具
      - name: Install create-dmg (macOS only)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install pake-cli
        shell: bash
        run: |
          echo "Installing latest pake-cli..."
          pnpm install pake-cli@latest

          # Verify installation
          if [ ! -d "node_modules/pake-cli" ]; then
            echo "Error: Failed to install pake-cli"
            exit 1
          fi

          echo "Listing pake-cli contents:"
          ls -la node_modules/pake-cli/ | head -5
          echo "pake-cli installation verified"

      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            node_modules/pake-cli/src-tauri/target/
          key: ${{ inputs.platform }}-cargo-${{ hashFiles('node_modules/pake-cli/src-tauri/Cargo.lock') }}

      # 🔄 修改：即使失败也继续
      - name: Build with pake-cli
        id: build
        timeout-minutes: 15
        continue-on-error: true
        run: |
          node ./scripts/github-action-build.js
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          ICON: ${{ inputs.icon }}
          HEIGHT: ${{ inputs.height }}
          WIDTH: ${{ inputs.width }}
          HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          FULLSCREEN: ${{ inputs.fullscreen }}
          MULTI_ARCH: ${{ inputs.multi_arch }}
          TARGETS: ${{ inputs.targets }}
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1

      # 🆕 macOS 专用：手动打包 DMG
      - name: Manual DMG packaging (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Searching for .app bundle..."
          
          # 查找 .app 文件
          APP_PATH=$(find node_modules/pake-cli/src-tauri/target -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          
          # 确保 output 目录存在
          mkdir -p node_modules/pake-cli/output
          
          # 尝试查找现有的 DMG
          EXISTING_DMG=$(find node_modules/pake-cli/src-tauri/target -name "*.dmg" | head -1)
          
          if [ -n "$EXISTING_DMG" ]; then
            echo "✅ DMG already exists: $EXISTING_DMG"
            cp "$EXISTING_DMG" node_modules/pake-cli/output/
          else
            echo "📦 Creating DMG manually..."
            
            # 创建 DMG
            create-dmg \
              --volname "${{ inputs.name }}" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --app-drop-link 600 185 \
              "node_modules/pake-cli/output/${{ inputs.name }}.dmg" \
              "$APP_PATH" || {
                echo "⚠️ DMG creation failed, creating zip instead"
                cd "$(dirname "$APP_PATH")"
                zip -r "${{ inputs.name }}.app.zip" "$(basename "$APP_PATH")"
                mv "${{ inputs.name }}.app.zip" "$GITHUB_WORKSPACE/node_modules/pake-cli/output/"
              }
          fi
          
          # 同时也打包 .app 作为备份
          echo "📦 Creating .app.zip as backup..."
          cd "$(dirname "$APP_PATH")"
          zip -r "${{ inputs.name }}.app.zip" "$(basename "$APP_PATH")"
          mv "${{ inputs.name }}.app.zip" "$GITHUB_WORKSPACE/node_modules/pake-cli/output/"
          
          # 列出 output 目录内容
          echo "📁 Output directory contents:"
          ls -lh "$GITHUB_WORKSPACE/node_modules/pake-cli/output/"

      # 🔄 修改：检查是否有输出文件
      - name: Verify output
        shell: bash
        run: |
          if [ -d "node_modules/pake-cli/output" ]; then
            echo "Output directory contents:"
            ls -lh node_modules/pake-cli/output/
            
            FILE_COUNT=$(ls -1 node_modules/pake-cli/output/ 2>/dev/null | wc -l)
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "❌ No output files found!"
              exit 1
            fi
            echo "✅ Found $FILE_COUNT output file(s)"
          else
            echo "❌ Output directory not found!"
            exit 1
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ inputs.platform }}.zip
          path: node_modules/pake-cli/output/*
          retention-days: 3

      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            node_modules/pake-cli/src-tauri/target/
          key: ${{ inputs.platform }}-cargo-${{ hashFiles('node_modules/pake-cli/src-tauri/Cargo.lock') }}
